[project]
name = "small-ecommerce-catalog-screen-corpus"
version = "1.0.0"
description = "Shared evidence corpus for cold-start recommendation heuristic screening in small e-commerce catalogs (25 catalogs, one common schema)."
requires-python = ">=3.12"
dependencies = [
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "et-xmlfile==2.0.0",
    "idna==3.20",
    "loguru==0.7.3",
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
    "six==1.17.0",
    "urllib3==2.8.0",
]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build_backend"

[tool.uv]
package = false